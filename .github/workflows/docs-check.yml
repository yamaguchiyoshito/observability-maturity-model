# CSV（唯一の正）と生成物（docs/model, docs/levels, スキル同梱 CSV）の同期を検証する。
# CSV を編集したら `python3 tools/build_docs.py` を実行してコミットすること。
name: docs-check

on:
  pull_request:
    paths:
      - "csv/**"
      - "docs/**"
      - "tools/**"
      - ".claude/skills/observability-maturity-assessment/**"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CSV の整合性（レベル定義とアクションプランの対応）
        run: python3 .claude/skills/observability-maturity-assessment/scripts/omm_model.py --validate-only
      - name: 生成物が CSV と同期しているか
        run: python3 tools/build_docs.py --check
      - name: スキルのスクリプトがこのリポジトリ自身を走査できるか（スモークテスト）
        run: |
          python3 .claude/skills/observability-maturity-assessment/scripts/scan_repo.py . --out /tmp/evidence.json --md /tmp/evidence.md
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/evidence.json"))
          assert d["axes"] and d["signals"], "走査結果が空です"
          print("signals:", len(d["signals"]), "axes:", list(d["axes"]))
          EOF
